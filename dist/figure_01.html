<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    padding: 20px;
    background: #1a1a1a;
    font-family: Arial, sans-serif;
}

.container {
    position: relative;
    display: inline-block;
    max-width: 100%;
}

.image-dropzone {
    width: 850px;
    height: 1250px;
    border: 3px dashed #4a9eff;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2a2a;
    cursor: pointer;
    position: relative;
}

.image-dropzone.has-image {
    border: none;
}

.dropzone-text {
    color: #4a9eff;
    font-size: 18px;
    text-align: center;
}

#mainImage {
    display: block;
    max-width: 100%;
    height: auto;
    position: absolute;
    top: 0;
    left: 0;
}

.annotation {
    position: absolute;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 0;
}

.annotation:hover {
    z-index: 200;
}

.arrow-container {
    position: relative;
    cursor: ew-resize;
    display: flex;
    align-items: center;
}

.arrow {
    height: 2px;
    background: currentColor;
    position: relative;
    min-width: 20px;
}

.arrow::after {
    content: '';
    position: absolute;
    right: -8px;
    top: -3px;
    width: 0;
    height: 0;
    border-left: 8px solid currentColor;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
}

.label {
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    white-space: nowrap;
    font-weight: bold;
    cursor: move;
    flex-shrink: 0;
}

.label-title {
    font-weight: bold;
    margin-bottom: 3px;
}

.sublabel {
    font-size: 10px;
    font-weight: normal;
    opacity: 0.9;
    display: block;
    margin-top: 2px;
}

.label[contenteditable='true']:focus {
    outline: 2px solid white;
    outline-offset: 2px;
    cursor: text;
}

.annotation-controls {
    position: absolute;
    top: -30px;
    right: 0;
    display: none;
    gap: 5px;
    background: #333;
    padding: 4px;
    border-radius: 4px;
}

.annotation:hover .annotation-controls {
    display: flex;
}

.control-btn {
    background: #444;
    border: 1px solid #555;
    color: white;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
}

.control-btn:hover {
    background: #555;
}

.blue { color: white; }
.blue .label { background: #4a9eff; }
.blue .arrow { color: #4a9eff; }

.orange { color: white; }
.orange .label { background: #ff6b35; }
.orange .arrow { color: #ff6b35; }

.purple { color: white; }
.purple .label { background: #a78bfa; }
.purple .arrow { color: #a78bfa; }

.yellow { color: #1a1a1a; }
.yellow .label { background: #fbbf24; }
.yellow .arrow { color: #fbbf24; }

.green { color: #1a1a1a; }
.green .label { background: #4aff4a; }
.green .arrow { color: #4aff4a; }

.toolbar {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #2a2a2a;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #444;
    z-index: 1000;
}

.toolbar button {
    display: block;
    width: 100%;
    margin-bottom: 8px;
    padding: 8px 12px;
    background: #4a9eff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}

.toolbar button:hover {
    background: #3a8eef;
}

.toolbar select {
    width: 100%;
    padding: 6px;
    margin-bottom: 8px;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
}
</style>
</head>
<body>

<div class='toolbar'>
    <h3 style='color: white; margin: 0 0 10px 0; font-size: 14px;'>Controls</h3>
    <button onclick='addAnnotation()'>Add Annotation</button>
    <select id='colorSelect'>
        <option value='blue'>Blue</option>
        <option value='orange'>Orange</option>
        <option value='purple'>Purple</option>
        <option value='yellow'>Yellow</option>
        <option value='green'>Green</option>
    </select>
    <button onclick='exportPositions()'>Export JSON</button>
    <button onclick='clearAll()'>Clear All</button>
</div>

<div class='container'>
    <div class='image-dropzone' id='dropzone' onclick='document.getElementById("fileInput").click()'>
        <div class='dropzone-text'>
            Click to upload image<br>or drag and drop
        </div>
        <input type='file' id='fileInput' accept='image/*' style='display: none;'>
    </div>
</div>

<script>
let g_drag_element = null;
let g_drag_offset_x = 0;
let g_drag_offset_y = 0;
let g_annotation_counter = 0;
let g_resize_arrow = null;
let g_resize_start_x = 0;
let g_resize_start_width = 0;

const DEFAULT_ANNOTATIONS = [
    {
        x: 310, y: 152, arrow_width: 80, color: 'blue',
        title: 'Shutter speed input',
        subtitle: '(exposure time: 1/80 second)'
    },
    {
        x: 545, y: 152, arrow_width: 50, color: 'blue',
        title: 'ISO sensitivity input',
        subtitle: '(film/sensor sensitivity rating)'
    },
    {
        x: 370, y: 330, arrow_width: 90, color: 'orange',
        title: 'PRIMARY READING',
        subtitle: 'Calculated aperture (f-stop) for proper\nexposure based on measured light'
    },
    {
        x: 50, y: 335, arrow_width: -45, color: 'orange',
        title: 'Flash mode',
        subtitle: '(continuous light)'
    },
    {
        x: 200, y: 360, arrow_width: 60, color: 'green',
        title: 'ANALOG SCALE',
        subtitle: 'Visual f-stop range representation'
    },
    {
        x: 300, y: 365, arrow_width: 80, color: 'orange',
        title: 'Current reading',
        subtitle: '(matches f/5.0 position)'
    },
    {
        x: 570, y: 516, arrow_width: 60, color: 'purple',
        title: 'APPLY TO CAMERA',
        subtitle: 'Sends calculated settings\ndirectly to Blender camera'
    },
    {
        x: 570, y: 580, arrow_width: 60, color: 'purple',
        title: 'Current camera settings',
        subtitle: 'Shows what\'s set in scene'
    },
    {
        x: 570, y: 756, arrow_width: 60, color: 'yellow',
        title: 'RAW MEASUREMENT',
        subtitle: 'Actual lux reading from scene\nEV = Exposure Value'
    },
    {
        x: 570, y: 806, arrow_width: 60, color: 'yellow',
        title: 'Exposure compensation',
        subtitle: 'Manual adjustment ±EV'
    },
    {
        x: 570, y: 837, arrow_width: 60, color: 'yellow',
        title: 'f-stop increment precision',
        subtitle: '(1/3 or 1/10 stop steps)'
    },
    {
        x: 570, y: 935, arrow_width: 60, color: 'yellow',
        title: 'TECHNICAL PARAMETERS',
        subtitle: 'Calibration: meter sensitivity\nLumisphere FOV: diffuser angle\nResolution: render quality\nSamples: noise reduction'
    }
];

function setupImageUpload() {
    const file_input = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    
    file_input.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            loadImage(file);
        }
    });
    
    dropzone.addEventListener('dragover', function(event) {
        event.preventDefault();
        dropzone.style.borderColor = '#3a8eef';
    });
    
    dropzone.addEventListener('dragleave', function() {
        dropzone.style.borderColor = '#4a9eff';
    });
    
    dropzone.addEventListener('drop', function(event) {
        event.preventDefault();
        dropzone.style.borderColor = '#4a9eff';
        
        const file = event.dataTransfer.files[0];
        if (file && file.type.startsWith('image/')) {
            loadImage(file);
        }
    });
}

function loadImage(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const dropzone = document.getElementById('dropzone');
        dropzone.classList.add('has-image');
        dropzone.innerHTML = '<img id="mainImage" src="' + e.target.result + '">';
        dropzone.onclick = null;
        
        const img = document.getElementById('mainImage');
        img.onload = function() {
            dropzone.style.width = img.width + 'px';
            dropzone.style.height = img.height + 'px';
            loadDefaultAnnotations();
        };
    };
    reader.readAsDataURL(file);
}

function loadDefaultAnnotations() {
    DEFAULT_ANNOTATIONS.forEach(function(annotation_data) {
        createAnnotationFromData(annotation_data);
    });
}

function createAnnotationFromData(data) {
    const container = document.querySelector('.container');
    const annotation_id = 'annotation_' + g_annotation_counter++;
    
    const arrow_direction = data.arrow_width >= 0 ? '' : ' style="flex-direction: row-reverse;"';
    const arrow_width = Math.abs(data.arrow_width);
    const subtitle_lines = data.subtitle.split('\n').map(line => 
        '<span class="sublabel">' + line + '</span>'
    ).join('');
    
    const annotation_html = `
        <div class='annotation ${data.color}' id='${annotation_id}' style='left: ${data.x}px; top: ${data.y}px;'${arrow_direction}>
            <div class='annotation-controls'>
                <button class='control-btn' onclick='deleteAnnotation("${annotation_id}")'>×</button>
                <select class='control-btn' onchange='changeColor("${annotation_id}", this.value)'>
                    <option value='blue' ${data.color === 'blue' ? 'selected' : ''}>Blue</option>
                    <option value='orange' ${data.color === 'orange' ? 'selected' : ''}>Orange</option>
                    <option value='purple' ${data.color === 'purple' ? 'selected' : ''}>Purple</option>
                    <option value='yellow' ${data.color === 'yellow' ? 'selected' : ''}>Yellow</option>
                    <option value='green' ${data.color === 'green' ? 'selected' : ''}>Green</option>
                </select>
                <button class='control-btn' onclick='flipArrow("${annotation_id}")'>⇄</button>
            </div>
            <div class='arrow-container'>
                <div class='arrow' style='width: ${arrow_width}px;'></div>
            </div>
            <div class='label' contenteditable='true'>
                <div class='label-title'>${data.title}</div>
                ${subtitle_lines}
            </div>
        </div>
    `;
    
    container.insertAdjacentHTML('beforeend', annotation_html);
    setupDragging(annotation_id);
}

function addAnnotation() {
    const color = document.getElementById('colorSelect').value;
    createAnnotationFromData({
        x: 100, y: 100, arrow_width: 80, color: color,
        title: 'Edit Title',
        subtitle: 'Edit subtitle here'
    });
}

function setupDragging(annotation_id) {
    const element = document.getElementById(annotation_id);
    const arrow_container = element.querySelector('.arrow-container');
    const arrow = element.querySelector('.arrow');
    const label = element.querySelector('.label');
    
    label.addEventListener('mousedown', function(event) {
        if (label.getAttribute('contenteditable') === 'true' && !event.ctrlKey) {
            return;
        }
        
        g_drag_element = element;
        g_drag_offset_x = event.clientX - element.offsetLeft;
        g_drag_offset_y = event.clientY - element.offsetTop;
        event.preventDefault();
    });
    
    arrow_container.addEventListener('mousedown', function(event) {
        event.stopPropagation();
        g_resize_arrow = arrow;
        g_resize_start_x = event.clientX;
        g_resize_start_width = arrow.offsetWidth;
        
        const is_flipped = element.style.flexDirection === 'row-reverse';
        g_resize_arrow.is_flipped = is_flipped;
    });
}

document.addEventListener('mousemove', function(event) {
    if (g_drag_element) {
        g_drag_element.style.left = (event.clientX - g_drag_offset_x) + 'px';
        g_drag_element.style.top = (event.clientY - g_drag_offset_y) + 'px';
    }
    
    if (g_resize_arrow) {
        const delta = event.clientX - g_resize_start_x;
        const multiplier = g_resize_arrow.is_flipped ? -1 : 1;
        const new_width = g_resize_start_width + (delta * multiplier);
        g_resize_arrow.style.width = Math.max(20, new_width) + 'px';
    }
});

document.addEventListener('mouseup', function() {
    g_drag_element = null;
    g_resize_arrow = null;
});

function deleteAnnotation(annotation_id) {
    const element = document.getElementById(annotation_id);
    element.remove();
}

function changeColor(annotation_id, new_color) {
    const element = document.getElementById(annotation_id);
    const classes = element.className.split(' ');
    element.className = classes[0] + ' ' + new_color;
}

function flipArrow(annotation_id) {
    const element = document.getElementById(annotation_id);
    const current_direction = element.style.flexDirection;
    element.style.flexDirection = current_direction === 'row-reverse' ? '' : 'row-reverse';
}

function exportPositions() {
    const annotations = document.querySelectorAll('.annotation');
    const export_data = [];
    
    annotations.forEach(function(annotation) {
        const arrow = annotation.querySelector('.arrow');
        const label = annotation.querySelector('.label');
        const color = annotation.className.split(' ')[1];
        const is_flipped = annotation.style.flexDirection === 'row-reverse';
        const arrow_width = arrow.offsetWidth * (is_flipped ? -1 : 1);
        
        export_data.push({
            id: annotation.id,
            x: parseInt(annotation.style.left),
            y: parseInt(annotation.style.top),
            arrow_width: arrow_width,
            color: color,
            text: label.innerHTML
        });
    });
    
    console.log(JSON.stringify(export_data, null, 2));
    alert('JSON exported to console (F12)');
}

function clearAll() {
    const annotations = document.querySelectorAll('.annotation');
    annotations.forEach(function(annotation) {
        annotation.remove();
    });
    g_annotation_counter = 0;
}

setupImageUpload();
</script>

</body>
</html>
